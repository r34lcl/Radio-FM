# Radio FM: RTL-SDR → airspy-fmradion → Icecast, con web pública y admin.
# Configuración en .env (copiar .env.example). Ver README.md.
name: fm-radio

services:
  icecast:
    build: .
    image: fm-radio:latest
    command: icecast.sh
    restart: unless-stopped
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD}
      ICECAST_HOSTNAME: ${ICECAST_HOSTNAME:-localhost}
      ICECAST_MAX_CLIENTS: ${ICECAST_MAX_CLIENTS:-20}
    # Icecast solo en el propio host (para su página de admin); los oyentes entran por la web,
    # que registra cada conexión. Quitar "127.0.0.1:" para exponerlo en la red.
    ports:
      - "127.0.0.1:${ICECAST_PORT:-8010}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8000/status-json.xsl"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  tuner:
    image: fm-radio:latest
    command: tuner.sh
    init: true
    restart: unless-stopped
    depends_on:
      icecast:
        condition: service_healthy
    environment:
      FREQ: ${FREQ}
      GAIN: ${GAIN:-auto}
      STEREO: ${STEREO:-1}
      BITRATE: ${BITRATE:-192k}
      DEVICE_INDEX: ${DEVICE_INDEX:-0}
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD}
    # Se monta todo el bus USB (major 189) para que el dongle siga accesible
    # si se desconecta y reconecta con otro número de dispositivo.
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      # Sintonía elegida desde la web (plan, stereo, gain; prioridad sobre .env) y
      # escaneos de la banda (el tuner escribe scan_status.json / scan_result.json)
      - ./state:/state
    device_cgroup_rules:
      - "c 189:* rwm"

  web:
    image: fm-radio:latest
    command: ["python3", "-I", "/app/app.py"]
    restart: unless-stopped
    depends_on:
      icecast:
        condition: service_healthy
    environment:
      FREQ: ${FREQ}
      STEREO: ${STEREO:-1}
      WEB_USER: ${WEB_USER}
      WEB_PASSWORD: ${WEB_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      LISTENER_LOG_DAYS: ${LISTENER_LOG_DAYS:-90}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    volumes:
      - ./web:/app:ro
      - ./state:/state
    ports:
      - "${WEB_PORT:-8080}:8080"

  songid:
    build: ./songid
    image: fm-radio-songid:latest
    restart: unless-stopped
    depends_on:
      icecast:
        condition: service_healthy
    environment:
      FREQ: ${FREQ}
      SONGID_INTERVAL: ${SONGID_INTERVAL:-45}
    volumes:
      - ./state:/state
